name: CI

# The macOS `check: Build and Test` job was removed on 2026-08-02. It ran `swift build` + `swift test`
# on macos-26 for every PR and every push to main, with neither a paths filter nor a concurrency
# group, and on its own accounted for 980 of the account's 2,063 billed Linux-equivalent Actions
# minutes in July — 33% of the monthly allowance, and 94% of all macOS minutes across every repo.
# (macOS bills at 10x Linux.) The account's two other active Swift CI jobs run comparable work for
# ~1% of the allowance each, because each is gated behind both a paths filter and a
# `concurrency: cancel-in-progress` group. This one had neither.
#
# Where the guarantees went:
#   - `swift test` — the dev session runs it locally and states the result in the PR description,
#     per the standing no-CI-tests rule for Apple targets.
#   - the macOS 15 deployment-floor compile guarantee — re-established at tag time by release.yml,
#     which builds this same package on macos-26 before signing and notarizing. Low frequency,
#     explicitly triggered, and not replaceable on Linux, so it stays.
#
# Do NOT reintroduce a macOS job in this workflow. macOS belongs only in the low-frequency,
# tag-triggered release.yml. Note that the obvious throttle does not even apply here: `paths` is a
# workflow-level trigger filter, not a job attribute, so adding one would also skip the ubuntu
# `Lockfiles agree` job — which is a required status check, and required checks must not sit behind
# a paths filter (they would hang at Expected forever). See script/apply_github_protections.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfiles:
    name: Lockfiles agree
    # Two resolved files pin the same three dependencies for two different build paths: the root
    # `Package.resolved` governs `swift build` / `swift test`, and the one under the Xcode project
    # governs Xcode and Xcode Cloud (the project declares its own remote packages — see project.yml).
    # Nothing updates them together: Dependabot's swift ecosystem only knows the SwiftPM one, so a bump
    # moves that file alone and the shipped app quietly keeps linking the version nobody just tested.
    # This job is the tripwire for that. Seconds on ubuntu, so it isn't the macOS test cost the
    # no-CI-tests rule is about.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare resolved dependency pins
        run: python3 .github/scripts/check_lockfiles.py
