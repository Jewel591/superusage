name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfiles:
    name: Lockfiles agree
    # Two resolved files pin the same three dependencies for two different build paths: the root
    # `Package.resolved` governs `swift build` / `swift test`, and the one under the Xcode project
    # governs Xcode and Xcode Cloud (the project declares its own remote packages — see project.yml).
    # Nothing updates them together: Dependabot's swift ecosystem only knows the SwiftPM one, so a bump
    # moves that file alone and the shipped app quietly keeps linking the version nobody just tested.
    # This job is the tripwire for that. Seconds on ubuntu, so it isn't the macOS test cost the
    # no-CI-tests rule is about.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare resolved dependency pins
        run: python3 .github/scripts/check_lockfiles.py

  check:
    name: Build and Test
    # Builds against the macOS 26 SDK with the package's macOS 15 deployment target (Package.swift
    # .macOS(.v15)), so this compiles the whole codebase — including the `if #available(macOS 26, *)`
    # Liquid Glass branches — for the macOS 15 floor. That is the floor's compile guarantee: a binary
    # built here reports minos 15.0. We do NOT add a macos-15 runner leg — back-deployment compiles
    # against the newest SDK, and a stock macos-15 runner ships Swift 6.1 without the macOS 26 SDK, so
    # it cannot build this package. Runtime verification on Sequoia is a manual smoke pass.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
